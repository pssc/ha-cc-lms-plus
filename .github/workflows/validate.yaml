name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate repository for HACS
        uses: hacs/action@22.5.0
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Validate integration with hassfest
        uses: home-assistant/actions/hassfest@1.0.0
